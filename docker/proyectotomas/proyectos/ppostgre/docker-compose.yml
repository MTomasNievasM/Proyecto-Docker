version: '3.8'

services:
  db:
    build:
      context: ${CONTEXTO}
      dockerfile: ./dockerfiles/05_postgre/Dockerfile
    container_name: cttomaspostgre
    image: mtomasnievasm/ubpostgre:latest
    ports:
      - "3461:22"     # SSH accesible desde el exterior por el puerto 3461
      - "5432:5432"   # Puerto de PostgreSQL
    env_file:
      - ./.env        # Uso de tu archivo .env local
    volumes:
      - ./logs:/root/logs
      - pgdata:/var/lib/postgresql/data  # Volumen para persistencia de datos
    networks:
      - red_proyectotomas

volumes:
  pgdata:

networks:
  red_proyectotomas:
    external: true